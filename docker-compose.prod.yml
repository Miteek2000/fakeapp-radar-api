# Capa de PRODUCCIÓN (servidor AWS). Se usa junto al compose normal:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Agrega la pantalla web y un proxy HTTPS público (Caddy, solo TLS 1.3 con certificado real de Let's Encrypt).
# Solo el proxy publica puertos (80 y 443). La API, Redis y la base siguen sin exponerse a internet.
services:
  api:
    environment:
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: https://${SITE_ADDRESS:?Falta SITE_ADDRESS en .env}
      # Detrás de nuestro propio proxy: el límite de peticiones cuenta la IP real de cada visitante.
      TRUST_PROXY_HEADERS: "true"
    networks:
      - front

  web:
    build:
      context: ${WEB_CONTEXT:-../web}
      args:
        API_URL: http://api:8000
    image: apkradar-web:prod
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /app/.next/cache
    mem_limit: 512m
    pids_limit: 100
    depends_on:
      - api
    networks:
      - front

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Falta SITE_ADDRESS en .env}
    volumes:
      - ./proxy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    pids_limit: 100
    depends_on:
      - web
    networks:
      - edge     # salida a internet (certificado y puertos públicos)
      - front

networks:
  # Red entre proxy, pantalla web y API. Sin salida a internet.
  front:
    internal: true

volumes:
  caddy_data:
  caddy_config:

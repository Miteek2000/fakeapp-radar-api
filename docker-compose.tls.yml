# Capa opcional que agrega HTTPS (TLS 1.3). Se usa JUNTO al compose normal:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
# Entras por https://localhost (el puerto 3000 sigue siendo la pantalla web, sin cifrar).
services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # aquí se guarda el certificado local que genera Caddy
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 128m
    pids_limit: 100
    networks:
      - edge

  api:
    environment:
      # Con HTTPS la cookie de sesión solo viaja cifrada, y el origen https://localhost es de confianza.
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,https://localhost

volumes:
  caddy_data:
  caddy_config:

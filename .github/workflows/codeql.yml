name: CodeQL
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: +./security/codeql/WeakHashVariants.ql
          config: |
            paths-ignore: [security/codeql/ejemplos]
      - uses: github/codeql-action/analyze@v3

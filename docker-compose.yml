# La base de datos NO está aquí: vive en el repo fakeapp-radar-db.
# Orden de arranque:
#   1) en fakeapp-radar-db:  docker compose up -d --build
#   2) aquí:                 docker compose up --build -d
#
# Aislamiento de red:
#   backend      (interna, SIN internet): redis, api, worker, beat
#   fakeapp-net  (interna, creada por el repo -db): llega a PostgreSQL
#   edge         (con salida): solo la API, únicamente para publicar su puerto en tu PC
# El worker abre APK no confiables: no está en ninguna red con salida, así que un APK
# malicioso no podría sacar datos por internet aunque lograra ejecutar código.
# La consulta a VirusTotal la hace OTRO servicio (vt-worker): es el único con internet y la clave,
# y solo recibe el SHA-256 (no ve los archivos ni la clave de cifrado).

x-app-env: &app-env
  UPLOAD_DIR: /data/uploads
  REDIS_URL: redis://:${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env}@redis:6379/0
  DATABASE_URL: ${DATABASE_URL:?Falta DATABASE_URL en .env (apunta a la base del repo fakeapp-radar-db)}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Falta ENCRYPTION_KEY en .env}
  RETENTION_DAYS: ${RETENTION_DAYS:-30}
  ORPHAN_UPLOAD_HOURS: ${ORPHAN_UPLOAD_HOURS:-24}

# Endurecimiento común: sin privilegios extra, sin escalar permisos, disco de solo lectura.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp

services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    <<: *hardening
    mem_limit: 256m
    pids_limit: 100
    networks:
      - backend
    # Sin "ports": Redis solo es visible para los otros contenedores, no desde tu PC.

  api:
    build: .
    image: fakeapp-radar-api:dev
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *app-env
      # Solo la API firma tokens: el worker, beat y vt-worker no reciben esta clave.
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64:?Falta JWT_PRIVATE_KEY_B64 en .env (ver .env.example)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_ANONYMOUS: ${ALLOW_ANONYMOUS:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}
      # El límite de peticiones se cuenta en Redis (base 1), así vale para todos los procesos de la API.
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD}@redis:6379/1
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}  # solo se apaga para la corrida de ZAP
    volumes:
      - uploads:/data/uploads
    depends_on:
      redis:
        condition: service_healthy
    <<: *hardening
    mem_limit: 512m
    pids_limit: 100
    networks:
      - backend
      - edge
      - fakeapp-net

  worker:
    build: .
    image: fakeapp-radar-api:dev
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2", "-Q", "celery"]
    environment: *app-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      redis:
        condition: service_healthy
    <<: *hardening
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 200
    networks:
      - backend
      - fakeapp-net

  # Consulta VirusTotal por SHA-256. Sin carpeta de subidas y sin ENCRYPTION_KEY a propósito.
  vt-worker:
    build: .
    image: fakeapp-radar-api:dev
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=1", "-Q", "vt", "-n", "vt@%h"]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env}@redis:6379/0
      DATABASE_URL: ${DATABASE_URL:?Falta DATABASE_URL en .env (apunta a la base del repo fakeapp-radar-db)}
      VT_API_KEY: ${VT_API_KEY:-}
      VT_CACHE_HOURS: ${VT_CACHE_HOURS:-24}
    depends_on:
      redis:
        condition: service_healthy
    <<: *hardening
    mem_limit: 256m
    pids_limit: 50
    networks:
      - backend
      - edge
      - fakeapp-net

  # Programa la limpieza diaria de retención (la ejecuta el worker).
  beat:
    build: .
    image: fakeapp-radar-api:dev
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
    <<: *hardening
    mem_limit: 256m
    pids_limit: 50
    networks:
      - backend

networks:
  backend:
    internal: true
  edge: {}
  # Creada por el repo fakeapp-radar-db (también interna).
  fakeapp-net:
    name: fakeapp-net
    external: true

volumes:
  uploads:

x-app-env: &app-env
  UPLOAD_DIR: /data/uploads
  REDIS_URL: redis://:${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env}@redis:6379/0
  DATABASE_URL: postgresql+psycopg://fakeapp:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}@db:5432/fakeapp_radar
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Falta ENCRYPTION_KEY en .env}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Sin "ports": Redis solo es visible para los otros contenedores, no desde tu PC.

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fakeapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: fakeapp_radar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fakeapp -d fakeapp_radar"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Sin "ports": solo la API y el worker llegan a la base. Para entrar tú:
    #   docker compose exec db psql -U fakeapp -d fakeapp_radar

  migrate:
    build: .
    image: fakeapp-radar-api:dev
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: fakeapp-radar-api:dev
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    environment: *app-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    image: fakeapp-radar-api:dev
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment: *app-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  uploads:
  pgdata:

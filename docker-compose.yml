# La base de datos NO está aquí: vive en el repo fakeapp-radar-db.
# Orden de arranque:
#   1) en fakeapp-radar-db:  docker compose up -d --build
#   2) aquí:                 docker compose up --build -d
x-app-env: &app-env
  UPLOAD_DIR: /data/uploads
  REDIS_URL: redis://:${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env}@redis:6379/0
  DATABASE_URL: ${DATABASE_URL:?Falta DATABASE_URL en .env (apunta a la base del repo fakeapp-radar-db)}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Falta ENCRYPTION_KEY en .env}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Sin "ports": Redis solo es visible para los otros contenedores, no desde tu PC.

  api:
    build: .
    image: fakeapp-radar-api:dev
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    environment: *app-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - fakeapp-net

  worker:
    build: .
    image: fakeapp-radar-api:dev
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment: *app-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - fakeapp-net

networks:
  # Red creada por el repo fakeapp-radar-db; por ahí la API llega a PostgreSQL.
  fakeapp-net:
    name: fakeapp-net
    external: true

volumes:
  uploads:
